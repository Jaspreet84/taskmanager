[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-cli"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "gspread>=6.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "tabulate>=0.9",
]

[project.scripts]
todo = "cli:cli"

[tool.setuptools]
py-modules = ["cli", "config", "models", "storage", "todo"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["todo-cli"]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = ["venv", ".git", "__pycache__", "build", "dist", "todo-cli"]
