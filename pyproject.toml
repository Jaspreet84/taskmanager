[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "todo-cli"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "gspread>=6.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "tabulate>=0.9",
]

[project.scripts]
todo = "todo:cli"
